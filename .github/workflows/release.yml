name: Release build
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: write        # create the release on a tag
  id-token: write        # signed proof of origin (build provenance)
  attestations: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '10.0.x' }
      - name: WiX
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.2
          wix extension add -g WixToolset.UI.wixext/5.0.2
      - name: Build exe, zip, msi and checksums
        shell: pwsh
        run: ./installer/build-installer.ps1
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            artifacts/DriveBox-*.msi
            artifacts/DriveBox-*.zip
            artifacts/DriveBox.exe
      - uses: actions/upload-artifact@v4
        with:
          name: DriveBox-windows
          path: |
            artifacts/DriveBox-*.msi
            artifacts/DriveBox-*.zip
            artifacts/SHA256SUMS.txt
      - name: Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          V="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" artifacts/DriveBox-*.msi artifacts/DriveBox-*.zip artifacts/SHA256SUMS.txt --title "DriveBox $V" --notes "See CHANGELOG.md. Use the portable zip if installers are not allowed on your PC (no administrator rights needed). The files are not code-signed yet, so Windows SmartScreen may warn: choose More info, then Run anyway."
